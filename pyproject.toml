[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-structured-sequence"
version = "0.1.0"
description = "Hybrid quantum-classical sequence modelling: structured periodic interactions and quantum-assisted retrieval."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pennylane>=0.36",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "torch>=2.2",
  "matplotlib>=3.8",
  "hnswlib>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

